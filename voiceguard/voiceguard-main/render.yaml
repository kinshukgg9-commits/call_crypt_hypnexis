# Render blueprint: New > Blueprint > pick this repository. Free plan, 512 MB.
services:
  - type: web
    name: voiceguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.free
    healthCheckPath: /health
    # Singapore is the closest Render region to India: much shorter round trips than the US regions.
    # (Render can't move an existing service: create a new one from this blueprint.)
    region: singapore
    envVars:
      - key: DATABASE_URL          # mysql://user:pass@host:3306/voiceguard?ssl=true
        sync: false
      - key: STORAGE_ADMIN_TOKEN
        generateValue: true
