# Render's free plan puts the backend to sleep after 15 minutes without traffic, and waking it
# takes a minute or more. Pinging /health every 10 minutes keeps it awake.
# One always-on free service uses about 730 of the 750 free instance-hours a month.
# GitHub may delay scheduled runs, and pauses them after 60 days without commits.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${BACKEND_URL:-https://voiceguard-api-3x3m.onrender.com}/health"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
